services:
  orderflow-api:
    build:
      context: ../../orderflow-api
    container_name: orderflow-api
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://pg-orderflow:5432/db_orderflow
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: pgpass321
      ORDERFLOW_KAFKA_BOOTSTRAP_SERVERS: kafka-broker-1:9092
      ORDERFLOW_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    networks:
      - orderflow-net

  orderflow-consumer:
    build:
      context: ../../orderflow-consumer
    container_name: orderflow-consumer
    restart: unless-stopped
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://pg-orderflow:5432/db_orderflow
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: pgpass321
      ORDERFLOW_KAFKA_BOOTSTRAP_SERVERS: kafka-broker-1:9092
      ORDERFLOW_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    networks:
      - orderflow-net

networks:
  orderflow-net:
    external: true
